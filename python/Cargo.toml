[package]
name = "zapd-python"
version = "1.1.2"
edition = "2021"
publish = false
description = "The ZAP router, embedded in Python: `import zapd`"
license = "MIT OR Apache-2.0"

# One router implementation. Python embeds the same crate Rust hosts link; this
# is only the binding.
[lib]
name = "zapd"
crate-type = ["cdylib"]

[dependencies]
zapd = { path = ".." }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

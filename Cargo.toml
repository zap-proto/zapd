[workspace]
members = [".", "python"]

[package]
name = "zapd"
version = "1.1.3"
edition = "2021"
rust-version = "1.81"
description = "The ZAP router — embedded in every ZAP process; one per user login, elected by lock"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zap-proto/zapd"
keywords = ["zap", "zapd", "router", "broker", "rpc"]
categories = ["network-programming"]

# The router is a library: every process that speaks ZAP embeds it and the
# lock elects one of them. The `zapd` binary is the operator's tool — `pair`
# and `ls` — and never serves.
[lib]
path = "src/lib.rs"

[[bin]]
name = "zapd"
path = "src/main.rs"

[dependencies]
# The router is schema-agnostic: it never parses a payload, so it depends on NO
# ZAP schema crate and no capnp. It moves opaque ZAP frames on tokio alone.
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
tracing = "0.1"
directories = "5"
# fcntl(2) record lock (the election) and getuid(2) (the per-user port).
libc = "0.2"
# The browser door: a loopback WebSocket, because a browser extension can open
# nothing else. Handshake only — no TLS, no client connector in the router.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Pairing: HMAC-SHA256 challenge-response over a 32-byte token; the token
# never crosses the wire.
hmac = "0.13"
sha2 = "0.11"
getrandom = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
